name: Compilar piOca Empleado IA
'on':
  workflow_dispatch: {}
  push:
    paths:
    - app/**
    - settings.gradle
    - .github/workflows/compilar-empleado-ia.yml
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Recuperar firma estable si está configurada
      shell: bash
      env:
        KEYSTORE: ${{ secrets.PIOCA_RESPUESTAS_DEBUG_KEYSTORE_B64 }}
      run: "if [[ -n \"$KEYSTORE\" ]]; then\n  mkdir -p ~/.android\n  umask 077\n\
        \  echo \"$KEYSTORE\" | base64 -d > ~/.android/debug.keystore\nfi"
    - name: Compilar APK
      run: 'gradle :app:assembleDebug --no-daemon

        cp app/build/outputs/apk/debug/app-debug.apk piOca-Empleado-IA.apk'
    - uses: actions/upload-artifact@v4
      with:
        name: piOca-Empleado-IA
        path: piOca-Empleado-IA.apk
        if-no-files-found: error
